switchLanguage('en');

function switchLanguage(lang) {
    document.getElementById('name').textContent = cvData.profile.name;
    document.getElementById('dob').textContent = cvData.profile.dob;
    document.getElementById('location').textContent = cvData.profile.location[lang];
    document.getElementById('email').textContent = cvData.profile.email;
    document.getElementById('phone').textContent = cvData.profile.phone;
    document.getElementById('profile-img').src = cvData.profile.image;

    let sectionsContainer = document.getElementById('sections');
    sectionsContainer.innerHTML = '';
    
    cvData.sections.forEach(section => {
        let sectionEl = document.createElement('section');
        sectionEl.innerHTML = `<h2>${section.title[lang]}</h2>`;
        section.experiences.forEach(exp => {
            let expEl = document.createElement('div');
            expEl.classList.add("section");
            expEl.innerHTML = `
                <h3>${exp.job[lang]}</h3>
                <span>${exp.date}</span>
                <p>${exp.description[lang]}</p>
            `;
            if (exp.tasks) {
                let ul = document.createElement('ul');
                exp.tasks[lang].forEach(task => {
                    let li = document.createElement('li');
                    li.textContent = task;
                    ul.appendChild(li);
                });
                expEl.appendChild(ul);
            }
            if (exp.image) {
                let img = document.createElement('img');
                img.src = exp.image;
                expEl.appendChild(img);
            }
            sectionEl.appendChild(expEl);
        });
        sectionsContainer.appendChild(sectionEl);
    });
}
</script>
